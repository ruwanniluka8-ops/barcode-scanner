<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-width: 450px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      display: none;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h2>📷 Barcode Scanner</h2>

  <video id="video" autoplay muted playsinline></video>

  <div id="result"></div>

  <script>

    const codeReader = new ZXing.BrowserMultiFormatReader();

    const videoElement = document.getElementById("video");
    const resultElement = document.getElementById("result");


    async function startScanner() {

      try {

        const devices = await codeReader.listVideoInputDevices();

        if (devices.length === 0) {

          resultElement.style.display = "block";

          resultElement.innerHTML =
            "<p>Camera not found.</p>";

          return;
        }


        // Try to select the back/rear camera
        let selectedDeviceId = devices[0].deviceId;

        for (let i = 0; i < devices.length; i++) {

          const label = devices[i].label.toLowerCase();

          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          ) {

            selectedDeviceId = devices[i].deviceId;
            break;
          }
        }


        codeReader.decodeFromVideoDevice(
          selectedDeviceId,
          videoElement,
          (result, error) => {

            if (result) {

              const barcode = result.getText();

              resultElement.style.display = "block";

              resultElement.innerHTML =
                "<h3>Barcode Found</h3>" +
                "<p><b>Barcode ID:</b> " +
                barcode +
                "</p>" +
                "<p>Opening item details...</p>";


              // Stop scanner
              codeReader.reset();


              // Open your Apps Script lookup page
              const appUrl =
                "https://script.google.com/macros/s/AKfycby1OkGHS6MPnc3lR-gGAYX2qjD0ucfpDJ1mHlhFiJyvyw6xmmjouB2rWuG2fLLN9vzf/exec";


              window.location.href =
                appUrl + "?barcode=" +
                encodeURIComponent(barcode);

            }

          }
        );

      } catch (error) {

        resultElement.style.display = "block";

        resultElement.innerHTML =
          "<h3>Camera Error</h3>" +
          "<p>" +
          error.message +
          "</p>";
      }
    }


    startScanner();

  </script>

</body>
</html>
